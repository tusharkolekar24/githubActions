name: Dev Branch File Change Logger

on:
  push:
    branches:
      - dev

jobs:
  list-changed-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # 2️⃣ Print changed files (with debug)
      - name: Print changed .txt, .sql, and .html, .py, .yml files
        run: |
          echo "================================="
          echo "Event name: ${{ github.event_name }}"
          echo "Changed files:"
          echo "================================="

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          echo "Before commit: $BEFORE"
          echo "After commit:  $AFTER"
          echo "---------------------------------"
          echo "ALL changed files:"
          git diff --name-only "$BEFORE" "$AFTER" || true

          echo "---------------------------------"
          echo "Filtered (.txt, .sql, .html, .py, .yml):"
          git diff --name-only "$BEFORE" "$AFTER" \
            | grep -Ei '\.(txt|sql|html|py|yml)$' \
            | while read -r file; do
                echo "$file"
              done || echo "No matching files changed"